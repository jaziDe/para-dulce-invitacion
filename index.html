<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba Música ❤️</title>

<style>
body{
    background:linear-gradient(135deg,#ff69b4,#ffb6c1);
    font-family:Arial,sans-serif;
    text-align:center;
    color:white;
    padding:30px;
}

button{
    padding:15px 25px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:#ff1493;
    color:white;
    cursor:pointer;
    margin:15px;
}

img{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:20px;
    margin:10px;
}
</style>
</head>
<body>

<audio id="audioPerdidos">
    <source src="Perdidos.mp3" type="audio/mpeg">
</audio>

<audio id="audioCoqueta">
    <source src="Coqueta.mp3" type="audio/mpeg">
</audio>

<h1>🎵 Elige una canción mi amor 🎵</h1>

<img src="perdidos.jpg">
<br>
<button onclick="reproducirPerdidos()">
💖 Perdidos
</button>

<br><br>

<img src="coqueta.jpg">
<br>
<button onclick="reproducirCoqueta()">
🌹 Coqueta
</button>

<script>

function reproducirPerdidos(){

document.getElementById("audioCoqueta").pause();

let audio =
document.getElementById("audioPerdidos");

audio.currentTime = 0;

audio.play();

alert("❤️ Sonando Perdidos ❤️");

}

function reproducirCoqueta(){

document.getElementById("audioPerdidos").pause();

let audio =
document.getElementById("audioCoqueta");

audio.currentTime = 0;

audio.play();

alert("❤️ Sonando Coqueta ❤️");

}

</script>

</body>
</html>
