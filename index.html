<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💖 Para Dulce 💖</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff69b4,#ffb6c1);
    color:white;
    text-align:center;
    overflow-x:hidden;
}

.pantalla{
    padding:20px;
}

.oculto{
    display:none;
}

button{
    background:#ff1493;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    margin:10px;
}

button:hover{
    transform:scale(1.05);
}

.galeria{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.galeria img{
    width:320px;
    height:240px;
    object-fit:cover;
    border-radius:20px;
    border:4px solid white;
    box-shadow:0 0 20px white;
}

.canciones{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:40px;
}

.cancion img{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:20px;
    border:4px solid white;
}

input[type="date"],
input[type="text"]{
    padding:10px;
    border-radius:10px;
    border:none;
    width:80%;
    max-width:400px;
    margin:10px;
}

.corazon{
    position:fixed;
    color:red;
    font-size:25px;
    animation:subir 5s linear infinite;
}

@keyframes subir{
from{
transform:translateY(100vh);
opacity:1;
}
to{
transform:translateY(-100px);
opacity:0;
}
}

</style>
</head>
<body>

<audio id="audioPerdidos" style="display:none;">
<source src="Perdidos.mp3" type="audio/mpeg">
</audio>

<audio id="audioCoqueta" style="display:none;">
<source src="Coqueta.mp3" type="audio/mpeg">
</audio>

<div id="pantalla1" class="pantalla">

<h1>💖 Para Dulce Emelina Guillen Morales 💖</h1>

<div class="galeria">
<img src="foto1.jpg">
<img src="foto2.jpg">
</div>

<h2>🎵 Elige una canción mi amor 🎵</h2>

<div class="canciones">

<div class="cancion">
<img src="perdidos.jpg">
<br><br>
<button onclick="elegirMusica('perdidos')">
💖 Perdidos
</button>
</div>

<div class="cancion">
<img src="coqueta.jpg">
<br><br>
<button onclick="elegirMusica('coqueta')">
🌹 Coqueta
</button>
</div>

</div>

</div>


<div id="pantalla2" class="pantalla oculto">

<h1>💕 ¿Me amas? 💕</h1>

<div class="galeria">
<img src="foto1.jpg">
<img src="foto2.jpg">
</div>

<button onclick="meAma()">
❤️ Me amas
</button>

<button onclick="noMeAma()">
💔 No me amas y solo es una broma pal yutu :c
</button>

</div>


<div id="pantalla3" class="pantalla oculto">

<h1>💖 ¿Te gustaría salir conmigo? 💖</h1>

<button onclick="respuesta('a) Sí, claro mi amor')">
a) 💘 Sí, claro mi amor
</button>

<button onclick="respuesta('b) opción(a)')">
b) 💕 opción(a)
</button>

</div>


<div id="pantalla4" class="pantalla oculto">

<h1>💕 ¿A dónde te gustaría ir? 💕</h1>

<label>
<input type="radio" name="lugar" value="a) Al cine">
🎬 Al cine
</label>

<br><br>

<label>
<input type="radio" name="lugar" value="b) A comer">
🍔 A comer
</label>

<br><br>

<label>
<input type="radio" name="lugar" value="c) Otro lugar">
🌹 Otro lugar
</label>

<br>

<input
type="text"
id="otroLugar"
placeholder="Escribe el lugar">

<br>

<button onclick="elegirLugar()">
Continuar ❤️
</button>

</div>


<div id="pantalla5" class="pantalla oculto">

<h1>📅 Elige una fecha mi amor 📅</h1>

<input type="date" id="fecha">

<br>

<button onclick="finalizar()">
Enviar respuesta 💌
</button>

</div>


<div id="pantalla6" class="pantalla oculto">

<h1>❤️ Gracias mi amor ❤️</h1>

<div id="resultado"></div>

</div>


    <div id="pantallaEnserio" class="pantalla oculto">

<h1>💖 ¿Enserio??? 💖</h1>

<div class="galeria">
<img src="foto1.jpg">
<img src="foto2.jpg">
</div>

<button onclick="irSegurita()">
❤️ Sí ❤️
</button>

</div>


<div id="pantallaSegurita" class="pantalla oculto">

<h1>💖 ¿Segurita Segurita???? 💖</h1>

<div class="galeria">
<img src="foto1.jpg">
<img src="foto2.jpg">
</div>

<button onclick="irMiAmor()">
💕 Sí Mi Amor 💕
</button>

</div>


<div id="pantallaMiAmor" class="pantalla oculto">

<h1>❤️ Está bien mi amorrrrrrr ❤️</h1>

<div class="galeria">
<img src="foto1.jpg">
<img src="foto2.jpg">
</div>

<button onclick="irInvitacion()">
Continuar 💖
</button>

</div>
<script>

let datos={
respuesta:"",
lugar:"",
fecha:""
};

function elegirMusica(tipo){

if(tipo==="perdidos"){
document.getElementById("audioPerdidos").play();
}

if(tipo==="coqueta"){
document.getElementById("audioCoqueta").play();
}

document.getElementById("pantalla1").classList.add("oculto");
document.getElementById("pantalla2").classList.remove("oculto");

}

function meAma(){

document.getElementById("pantalla2").classList.add("oculto");
document.getElementById("pantallaEnserio").classList.remove("oculto");

}
    function irSegurita(){

document.getElementById("pantallaEnserio").classList.add("oculto");
document.getElementById("pantallaSegurita").classList.remove("oculto");

}

function irMiAmor(){

document.getElementById("pantallaSegurita").classList.add("oculto");
document.getElementById("pantallaMiAmor").classList.remove("oculto");

}

function irInvitacion(){

document.getElementById("pantallaMiAmor").classList.add("oculto");
document.getElementById("pantalla3").classList.remove("oculto");

}

function noMeAma(){

document.getElementById("audioPerdidos").pause();
document.getElementById("audioCoqueta").pause();

document.body.innerHTML=`
<h1 style="margin-top:100px;">
💔 Lo sabía, no me amas 💔
</h1>

<h2>
Está bien, como no me amas ya no vas a poder ver nada de lo que seguía.
</h2>
`;

}

function respuesta(opcion){

datos.respuesta=opcion;

document.getElementById("pantalla3").classList.add("oculto");
document.getElementById("pantalla4").classList.remove("oculto");

}

function elegirLugar(){

let seleccionado=
document.querySelector('input[name="lugar"]:checked');

if(!seleccionado){
alert("Selecciona un lugar ❤️");
return;
}

let lugar=seleccionado.value;

if(lugar==="c) Otro lugar"){

let otro=document.getElementById("otroLugar").value;

if(otro!=""){
lugar="c) "+otro;
}

}

datos.lugar=lugar;

document.getElementById("pantalla4").classList.add("oculto");
document.getElementById("pantalla5").classList.remove("oculto");

}

function finalizar(){

let fecha=document.getElementById("fecha").value;

if(fecha===""){
alert("Selecciona una fecha ❤️");
return;
}

datos.fecha=fecha;

fetch("https://formspree.io/f/mjyyeppd",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
respuesta:datos.respuesta,
lugar:datos.lugar,
fecha:datos.fecha
})
})
.then(response=>{

document.getElementById("pantalla5").classList.add("oculto");
document.getElementById("pantalla6").classList.remove("oculto");

document.getElementById("resultado").innerHTML=`
💖 Respuesta: ${datos.respuesta}<br><br>
💕 Lugar: ${datos.lugar}<br><br>
📅 Fecha: ${datos.fecha}
`;

})
.catch(error=>{
alert("Error al enviar la respuesta");
});

}

function crearCorazon(){

let corazon=document.createElement("div");

corazon.classList.add("corazon");

corazon.innerHTML="❤️";

corazon.style.left=Math.random()*100+"vw";

document.body.appendChild(corazon);

setTimeout(()=>{
corazon.remove();
},5000);

}

setInterval(crearCorazon,500);

</script>

</body>
</html>
